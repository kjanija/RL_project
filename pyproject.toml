[project]
name = "rl-project"
version = "0.1.0"
description = "Exam project for Reinforcement Learning"
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.3.0",
    "numpy>=2.5.1",
    "pytest>=9.1.1",
    "stable-baselines3>=2.9.0",
    "torch==2.13.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
